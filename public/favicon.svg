<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Lens body (circle) -->
  <circle cx="14" cy="14" r="10" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <!-- Inner lens reflection -->
  <circle cx="14" cy="14" r="6" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.5"/>
  <!-- Lens handle -->
  <line x1="21.5" y1="21.5" x2="29" y2="29" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>
  <!-- Small dot in center (focus point) -->
  <circle cx="14" cy="14" r="2" fill="#7c3aed" opacity="0.7"/>
</svg>
